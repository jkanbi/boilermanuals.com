<!DOCTYPE html>
<html lang="en" data-static-title>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta name="format-detection" content="telephone=no">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/images/apple-touch-icon.png">
    <title>Manual viewer | BoilerManuals.com</title>
    <link rel="stylesheet" type="text/css" href="/css/navbar.css?v=6">
    <link rel="stylesheet" type="text/css" href="/css/styles.css?v=6">
    <link rel="modulepreload" href="/pdfjs/build/pdf.min.mjs">
    <script src="/js/navbar.js?v=7"></script>
    <style>
        /* Jumps must be instant so pages in between are not fetched. */
        html, body { scroll-behavior: auto !important; }
        .pv-toolbar {
            position: sticky;
            top: 0;
            z-index: 900;
            display: flex;
            flex-wrap: nowrap;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
            padding: 4px 8px;
            background: var(--surface, #fff);
            border-bottom: 1px solid var(--border, #dfe2e6);
            box-shadow: 0 1px 3px rgba(27, 27, 27, 0.06);
            box-sizing: border-box;
            width: 100%;
            overflow: hidden;
        }
        .pv-toolbar .pv-group { display: flex; flex: 0 0 auto; align-items: center; gap: 3px; }
        .pv-toolbar .pv-spacer { flex: 1 1 auto; min-width: 0; }
        .pv-btn {
            display: inline-flex;
            flex: 0 0 auto;
            align-items: center;
            justify-content: center;
            gap: 6px;
            box-sizing: border-box;
            min-width: 40px;
            height: 40px;
            padding: 0 8px;
            border: 1px solid var(--border, #dfe2e6);
            border-radius: 8px;
            background: #f6f7f8;
            color: var(--text, #1b1b1b);
            font: 600 1.05rem/1 var(--font, system-ui, sans-serif);
            text-decoration: none;
            white-space: nowrap;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            user-select: none;
        }
        .pv-btn svg { width: 20px; height: 20px; flex: 0 0 auto; }
        .pv-btn:hover, .pv-btn:focus-visible { border-color: var(--accent, #1863dc); color: var(--accent, #1863dc); }
        .pv-btn:disabled { opacity: 0.4; cursor: default; }
        .pv-btn--primary { background: var(--accent, #1863dc); border-color: var(--accent, #1863dc); color: #fff; }
        .pv-btn--primary:hover, .pv-btn--primary:focus-visible { background: var(--accent-dark, #0f4eb5); color: #fff; }
        .pv-label-wide { display: none; }
        .pv-page {
            display: inline-flex;
            flex: 0 0 auto;
            align-items: center;
            gap: 3px;
            font: 600 0.95rem/1 var(--font, system-ui, sans-serif);
            white-space: nowrap;
        }
        .pv-page input {
            width: calc(3ch + 12px);
            height: 40px;
            padding: 0 4px;
            border: 1px solid var(--border, #dfe2e6);
            border-radius: 8px;
            font: 600 1rem/1 var(--font, system-ui, sans-serif);
            text-align: center;
            box-sizing: border-box;
            -moz-appearance: textfield;
        }
        .pv-page input::-webkit-outer-spin-button,
        .pv-page input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        @media (min-width: 600px) {
            .pv-toolbar { gap: 10px; padding: 6px 12px; }
            .pv-toolbar .pv-group { gap: 6px; }
            .pv-label-wide { display: inline; }
            .pv-btn { padding: 0 12px; }
        }
        @media (max-width: 359px) {
            .pv-toolbar { gap: 3px; padding: 4px; }
            .pv-toolbar .pv-group { gap: 2px; }
            .pv-btn { min-width: 36px; height: 36px; padding: 0 4px; }
            .pv-page input { height: 36px; width: calc(3ch + 8px); padding: 0 2px; }
            .pv-page { font-size: 0.85rem; gap: 2px; }
        }
        .pv-title {
            margin: 0;
            padding: 0.5rem 1rem 0;
            font-size: clamp(0.85rem, 2vw, 1.1rem);
            font-weight: 600;
            color: var(--text-muted, #6b7280);
            text-align: center;
            overflow-wrap: anywhere;
        }
        .pv-status {
            margin: 0.75rem auto;
            padding: 0 1rem;
            max-width: 46rem;
            text-align: center;
            font-size: 1.05rem;
            color: var(--text-muted, #6b7280);
        }
        .pv-status--error { color: #b3261e; }
        .pv-status a { font-weight: 600; }
        .pv-pages {
            padding: 0.75rem 0.5rem 2rem;
            overflow-x: auto;
        }
        .pv-pagebox {
            position: relative;
            margin: 0 auto 0.75rem;
            background: #fff;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.18);
        }
        .pv-pagebox canvas { display: block; width: 100%; height: 100%; }
        .pv-pagebox .pv-pagenum {
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            text-align: center;
            color: #9aa0a6;
            font-size: 1.1rem;
            transform: translateY(-50%);
        }
        .pv-pagebox.is-rendered .pv-pagenum { display: none; }
        /* In-manual text search */
        .pv-searchbar {
            position: sticky;
            z-index: 899;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 4px;
            padding: 4px 8px;
            background: var(--surface, #fff);
            border-bottom: 1px solid var(--border, #dfe2e6);
            box-shadow: 0 1px 3px rgba(27, 27, 27, 0.06);
            box-sizing: border-box;
            width: 100%;
        }
        .pv-searchbar[hidden] { display: none; }
        .pv-searchbar input {
            flex: 1 1 6rem;
            min-width: 0;
            height: 36px;
            padding: 0 10px;
            border: 1px solid var(--border, #dfe2e6);
            border-radius: 8px;
            font: 400 1rem/1 var(--font, system-ui, sans-serif);
            box-sizing: border-box;
        }
        .pv-search-count {
            flex: 0 0 auto;
            min-width: 3.2em;
            font: 600 0.85rem/1 var(--font, system-ui, sans-serif);
            color: var(--text-muted, #6b7280);
            text-align: center;
            white-space: nowrap;
        }
        .pv-btn--sm { min-width: 36px; height: 36px; padding: 0 6px; }
        .pv-btn[hidden], .pv-search-count:empty { display: none; }
        .pv-btn--text { font-size: 0.9rem; }
        .pv-search-msg {
            flex: 1 0 100%;
            margin: 0;
            padding: 2px 2px 4px;
            font-size: 0.9rem;
            color: var(--text-muted, #6b7280);
        }
        .pv-hl-layer { position: absolute; top: 0; right: 0; bottom: 0; left: 0; z-index: 1; pointer-events: none; }
        .pv-hl {
            position: absolute;
            background: rgba(255, 213, 0, 0.45);
            border-radius: 2px;
            mix-blend-mode: multiply;
        }
        .pv-hl.is-current {
            background: rgba(255, 120, 0, 0.55);
            outline: 2px solid #e8590c;
        }
        @media (max-width: 599px) {
            .pv-toolbar .pv-btn { min-width: 36px; padding: 0 6px; }
        }
        @media (max-width: 359px) {
            .pv-searchbar { gap: 2px; padding: 4px; }
            .pv-searchbar input { height: 34px; padding: 0 6px; }
            .pv-btn--sm { min-width: 32px; height: 34px; padding: 0 3px; }
            .pv-search-count { min-width: 2.6em; font-size: 0.78rem; }
            .pv-toolbar .pv-btn { min-width: 34px; padding: 0 3px; }
        }
    </style>
</head>
<body>
<div class="pv-toolbar" id="pvToolbar" role="toolbar" aria-label="Manual viewer controls">
    <div class="pv-group">
        <a class="pv-btn" id="pvBack" href="/" aria-label="Back" title="Back">&larr;<span class="pv-label-wide">Back</span></a>
    </div>
    <div class="pv-group">
        <button class="pv-btn" id="pvPrev" type="button" aria-label="Previous page" title="Previous page" disabled>&lsaquo;</button>
        <label class="pv-page"><span class="pv-label-wide">Page</span>
            <input id="pvPageInput" type="number" inputmode="numeric" min="1" value="1" aria-label="Page number" disabled>
            <span>/<span id="pvPageCount">&ndash;</span></span>
        </label>
        <button class="pv-btn" id="pvNext" type="button" aria-label="Next page" title="Next page" disabled>&rsaquo;</button>
    </div>
    <div class="pv-group">
        <button class="pv-btn" id="pvZoomOut" type="button" aria-label="Zoom out" title="Zoom out" disabled>&minus;</button>
        <button class="pv-btn" id="pvZoomIn" type="button" aria-label="Zoom in" title="Zoom in" disabled>+</button>
    </div>
    <div class="pv-group">
        <button class="pv-btn" id="pvSearchToggle" type="button" aria-label="Search in this manual" title="Search in this manual" aria-expanded="false" aria-controls="pvSearchBar" disabled><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="m15.5 15.5 5 5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg></button>
    </div>
    <div class="pv-spacer"></div>
    <div class="pv-group">
        <a class="pv-btn pv-btn--primary" id="pvDownload" href="/" rel="nofollow" aria-label="Download PDF" title="Download PDF"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" d="M12 3v12m-5-5 5 5 5-5M4 20h16"/></svg><span class="pv-label-wide">Download</span></a>
    </div>
</div>
<div class="pv-searchbar" id="pvSearchBar" role="search" aria-label="Search in this manual" hidden>
    <input id="pvSearchInput" type="search" placeholder="Search (e.g. F28)" enterkeyhint="search" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Search text in this manual">
    <span class="pv-search-count" id="pvSearchCount" aria-live="polite"></span>
    <button class="pv-btn pv-btn--sm" id="pvSearchPrev" type="button" aria-label="Previous match" title="Previous match" disabled><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m6 15 6-6 6 6" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <button class="pv-btn pv-btn--sm" id="pvSearchNext" type="button" aria-label="Next match" title="Next match" disabled><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m6 9 6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <button class="pv-btn pv-btn--sm pv-btn--text" id="pvSearchStop" type="button" aria-label="Stop searching" title="Stop searching" hidden>Stop</button>
    <button class="pv-btn pv-btn--sm" id="pvSearchClose" type="button" aria-label="Close search" title="Close search">&times;</button>
    <p class="pv-search-msg" id="pvSearchMsg" hidden></p>
</div>

<main>
    <h1 class="pv-title" id="pvTitle">Manual viewer</h1>
    <p class="pv-status" id="pvStatus" role="status" aria-live="polite">Loading manual&hellip;</p>
    <div class="pv-pages" id="pvPages"></div>
</main>

<footer class="site-footer site-footer--brand">
    <div class="footer-bottom">
        <p><a href="/index.html">Home</a> &middot; <a href="/contact.html">Request a manual</a> &middot; <a href="/contact.html?report=1" rel="nofollow">Report a wrong link</a></p>
        <p>&copy; BoilerManuals.com &mdash; part of the <a href="https://myboiler.com" rel="noopener">MyBoiler.com</a> family</p>
    </div>
</footer>

<script>
    /* Runs in every browser (no modules needed): validate ?file=, then set the
       title, Download and Back links. Only https://cdn.boilermanuals.com/ PDFs
       are allowed. */
    (function () {
        var ALLOWED_HOST = "cdn.boilermanuals.com";
        var state = { file: null, name: "", error: "" };
        var raw = null;
        try {
            raw = new URLSearchParams(window.location.search).get("file");
        } catch (e) {
            var m = /[?&]file=([^&#]*)/.exec(window.location.search);
            raw = m ? decodeURIComponent(m[1].replace(/\+/g, " ")) : null;
        }
        if (!raw) {
            state.error = "No manual was specified.";
        } else {
            var u = null;
            try { u = new URL(raw); } catch (e) { u = null; }
            if (!u || u.protocol !== "https:" || u.hostname !== ALLOWED_HOST || u.port ||
                u.username || u.password || !/\.pdf$/i.test(u.pathname)) {
                state.error = "This viewer only opens manuals from cdn.boilermanuals.com.";
            } else {
                u.hash = "";
                state.file = u.href;
                var seg = u.pathname.split("/").pop() || "";
                try { seg = decodeURIComponent(seg); } catch (e) {}
                state.name = seg.replace(/\.pdf$/i, "").replace(/[-_]+/g, " ").replace(/\s+/g, " ").trim();
            }
        }
        window.BMViewer = state;

        var dl = document.getElementById("pvDownload");
        var status = document.getElementById("pvStatus");
        if (state.file) {
            dl.href = state.file;
            document.title = state.name + " \u2013 Manual viewer | BoilerManuals.com";
            document.getElementById("pvTitle").textContent = state.name;
        } else {
            dl.style.display = "none";
            status.className = "pv-status pv-status--error";
            status.innerHTML = state.error + ' <a href="/">Search all manuals</a>.';
        }

        var back = document.getElementById("pvBack");
        var ref = document.referrer || "";
        var sameSite = /^https?:\/\/(www\.)?boilermanuals\.com\//i.test(ref) ||
            (ref && ref.indexOf(window.location.origin + "/") === 0);
        if (sameSite) {
            back.href = ref;
            back.addEventListener("click", function (ev) {
                if (window.history.length > 1) {
                    ev.preventDefault();
                    window.history.back();
                }
            });
        }
    })();
</script>
<script nomodule>
    (function () {
        if (window.BMViewer && window.BMViewer.file) {
            var s = document.getElementById("pvStatus");
            s.className = "pv-status pv-status--error";
            s.innerHTML = "This browser can't run the online viewer. Please use the Download button above.";
        }
    })();
</script>
<script type="module" src="/js/viewer.js?v=3"></script>
</body>
</html>
